server:
  port: 8080

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true

app:
  backend:
    base-url: http://localhost:8081
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  jwt:
    secret: "dev-secret-change-me-dev-secret-change-me-32chars"
    expiration-minutes: 1440

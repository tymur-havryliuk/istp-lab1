server:
  port: 8081

spring:
  application:
    name: lab1

  datasource:
    url: jdbc:postgresql://localhost:5432/istp_lab1
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  files:
    storage-dir: uploads
